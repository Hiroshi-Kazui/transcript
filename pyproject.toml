[project]
name = "transcript"
version = "0.1.0"
description = "日本語講話録音の一括文字起こしCLIツール"
requires-python = "==3.12.*"
dependencies = [
    "faster-whisper>=1.2.1",
]

[project.scripts]
transcribe = "transcript.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcript"]
