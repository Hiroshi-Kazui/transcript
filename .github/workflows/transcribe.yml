# pCloud 上の音声フォルダを定期的に文字起こしし、結果を pCloud に書き戻す。
#
# 事前設定(初回のみ):
#   1. ローカルで `rclone config` を実行し、pCloud リモートを「pcloud」の名前で作成
#      (OAuth 認証はブラウザで行われる)
#   2. 生成された rclone.conf を base64 化して repo secret に登録:
#        base64 -w0 ~/.config/rclone/rclone.conf   (Windows: certutil -encode)
#      → Settings > Secrets and variables > Actions > Secrets: RCLONE_CONF_B64
#   2b. ローカルで `claude setup-token` を実行し、表示された OAuth トークンを
#      Secrets: CLAUDE_CODE_OAUTH_TOKEN に登録(要約ステップがサブスクリプション枠で実行される)
#   3. 対象フォルダ(リモート内パス)を repo variable に登録:
#      → Variables: PCLOUD_FOLDER (例: REC_FILE/FOLDER01)
#
# 動作:
#   - フォルダ全体(既存の transcripts/ 含む)をランナーに取得するため、
#     処理済みファイルは CLI 側のスキップ判定がそのまま効く
#   - 結果は pCloud 側の <フォルダ>/transcripts/ に書き戻される
#   - モデル(約1.5GB)は actions/cache で2回目以降のダウンロードを回避

name: transcribe

on:
  # 定期実行は 2026-09-20 にユーザー決定で停止。ローカルPCの毎時タスク
  # (scripts/run-local.sh / タスク名 transcript-local)に処理を移したため。
  # クラウドに戻す場合は下のコメントを解除し、Actions 側の無効化も解除する
  # (gh workflow enable transcribe)。
  # schedule:
  #   - cron: "0 18 * * *" # 毎日 03:00 JST
  workflow_dispatch:
    inputs:
      folder:
        description: "pCloud上の音声フォルダ(未指定なら repo variable PCLOUD_FOLDER)"
        required: false
      weekly:
        description: "週次振り返りを強制生成する(通常は月曜JSTのみ)"
        type: boolean
        default: false

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PCLOUD_FOLDER: ${{ github.event.inputs.folder || vars.PCLOUD_FOLDER }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache HuggingFace model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-kotoba-whisper-v2.0-faster

      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONF_B64 }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Download audio from pCloud
        run: |
          test -n "$PCLOUD_FOLDER" || { echo "PCLOUD_FOLDER が未設定です" >&2; exit 1; }
          rclone copy "pcloud:${PCLOUD_FOLDER}" ./audio --progress

      - name: Transcribe
        id: run
        continue-on-error: true # 一部失敗でも成功分は書き戻す
        # pCloud側は日付サブフォルダ(例: 20260913/)に音声が入る構成。
        # CLIはフォルダ直下のみ走査するため、直下と各サブフォルダを順に処理する。
        run: |
          shopt -s nullglob
          status=0
          found=0
          for d in ./audio ./audio/*/; do
            files=("$d"/*.mp3 "$d"/*.wav "$d"/*.m4a "$d"/*.flac)
            [ ${#files[@]} -gt 0 ] || continue
            found=1
            echo "=== $d ==="
            uv run transcribe "$d" || status=1
          done
          if [ $found -eq 0 ]; then
            echo "音声ファイルが見つかりません(サブフォルダ含む) — 処理対象なしとしてスキップ"
            exit 0
          fi
          exit $status

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Summarize with Claude (Fable)
        id: summarize
        continue-on-error: true # 要約失敗でも文字起こし結果は書き戻す
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: bash scripts/summarize.sh ./audio

      - name: Weekly review with Claude (Fable, 月曜JSTのみ)
        id: weekly
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          FORCE_WEEKLY: ${{ github.event.inputs.weekly || 'false' }}
        run: |
          if [ "$FORCE_WEEKLY" != "true" ] && [ "$(TZ=Asia/Tokyo date +%u)" != "1" ]; then
            echo "月曜(JST)ではないため週次振り返りをスキップ"
            exit 0
          fi
          bash scripts/weekly.sh ./audio

      - name: Upload transcripts and summaries to pCloud
        # 各(サブ)フォルダ内の transcripts/ と summary.md を階層ごと書き戻す
        run: rclone copy ./audio "pcloud:${PCLOUD_FOLDER}" --include "transcripts/**" --include "summary.md" --include "/weekly/**" --progress

      - name: Fail if transcription or summarization had errors
        if: steps.run.outcome == 'failure' || steps.summarize.outcome == 'failure' || steps.weekly.outcome == 'failure'
        run: exit 1
